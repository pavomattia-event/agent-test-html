<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type="text"] { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 0.75rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .done { text-decoration: line-through; color: #666; }
  </style>
</head>
<body>
  <h1>Todo List</h1>

  <form id="todo-form">
    <input id="todo-input" type="text" placeholder="Add a task..." aria-label="Todo item" required>
    <button type="submit">Add</button>
  </form>

  <ul id="todo-list" aria-live="polite"></ul>

  <script src="script.js"></script>
</body>
</html>
